<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TrackMyWallet — Login</title>
  <meta name="description" content="Sign in or create your TrackMyWallet account to start tracking expenses and managing your budget." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/auth.css" />
</head>
<body>

  <!-- Animated background blobs -->
  <div class="bg-blob blob-1"></div>
  <div class="bg-blob blob-2"></div>
  <div class="bg-blob blob-3"></div>

  <div class="auth-container">

    <!-- Logo / Branding -->
    <div class="brand">
      <div class="brand-icon">💰</div>
      <h1 class="brand-name">TrackMyWallet</h1>
      <p class="brand-tagline">Smart expense tracking, smarter budgeting.</p>
    </div>

    <!-- Auth Card -->
    <div class="auth-card" id="authCard">

      <!-- Tab switcher -->
      <div class="tab-bar">
        <button class="tab-btn active" id="tabLogin" onclick="switchTab('login')">Sign In</button>
        <button class="tab-btn"        id="tabRegister" onclick="switchTab('register')">Create Account</button>
      </div>

      <!-- Alert banner (errors / success) -->
      <div class="alert" id="alertBox" style="display:none;"></div>

      <!-- ======== LOGIN FORM ======== -->
      <form class="auth-form" id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="loginUsername">Username</label>
          <div class="input-wrapper">
            <span class="input-icon">👤</span>
            <input type="text" id="loginUsername" name="username"
                   placeholder="Enter your username" required autocomplete="username" />
          </div>
        </div>

        <div class="form-group">
          <label for="loginPassword">Password</label>
          <div class="input-wrapper">
            <span class="input-icon">🔒</span>
            <input type="password" id="loginPassword" name="password"
                   placeholder="Enter your password" required autocomplete="current-password" />
            <button type="button" class="toggle-pw" onclick="togglePassword('loginPassword', this)">👁️</button>
          </div>
        </div>

        <button type="submit" class="btn-primary" id="loginBtn">
          <span class="btn-text">Sign In</span>
          <span class="btn-spinner" style="display:none;">⏳</span>
        </button>

        <p class="switch-hint">Don't have an account? <a href="#" onclick="switchTab('register')">Create one →</a></p>
      </form>

      <!-- ======== REGISTER FORM ======== -->
      <form class="auth-form hidden" id="registerForm" onsubmit="handleRegister(event)">
        <div class="form-group">
          <label for="regFullName">Full Name</label>
          <div class="input-wrapper">
            <span class="input-icon">🙋</span>
            <input type="text" id="regFullName" name="fullName"
                   placeholder="Your full name" required />
          </div>
        </div>

        <div class="form-group">
          <label for="regUsername">Username</label>
          <div class="input-wrapper">
            <span class="input-icon">👤</span>
            <input type="text" id="regUsername" name="username"
                   placeholder="Choose a username" required minlength="3" maxlength="50" />
          </div>
        </div>

        <div class="form-group">
          <label for="regEmail">Email Address</label>
          <div class="input-wrapper">
            <span class="input-icon">✉️</span>
            <input type="email" id="regEmail" name="email"
                   placeholder="your@email.com" required />
          </div>
        </div>

        <div class="form-group">
          <label for="regPassword">Password</label>
          <div class="input-wrapper">
            <span class="input-icon">🔒</span>
            <input type="password" id="regPassword" name="password"
                   placeholder="At least 6 characters" required minlength="6" />
            <button type="button" class="toggle-pw" onclick="togglePassword('regPassword', this)">👁️</button>
          </div>
        </div>

        <button type="submit" class="btn-primary" id="registerBtn">
          <span class="btn-text">Create Account</span>
          <span class="btn-spinner" style="display:none;">⏳</span>
        </button>

        <p class="switch-hint">Already have an account? <a href="#" onclick="switchTab('login')">Sign in →</a></p>
      </form>

    </div><!-- /auth-card -->

    <p class="footer-note">© 2026 TrackMyWallet · Your data stays private.</p>
  </div>

  <script src="/js/auth.js"></script>
</body>
</html>
