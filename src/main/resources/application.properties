 # ============================================================
#  TrackMyWallet - Application Configuration
#  IMPORTANT: Never put real passwords in this file.
#  Set the environment variable DB_PASSWORD in Windows before
#  running the app (see README or db-setup.md for instructions).
# ============================================================

# --- Server ---
server.port=8080

# --- DataSource (MySQL) ---
spring.datasource.url=jdbc:mysql://localhost:3306/trackmywallet?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:Mahima@143}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
# validate = verify DB schema matches entities; use 'update' only during dev
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Connection Pool (HikariCP - built into Spring Boot) ---
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# --- HTTP Session (for login/logout) ---
server.servlet.session.timeout=30m

# --- Static resources ---
spring.web.resources.static-locations=classpath:/static/

