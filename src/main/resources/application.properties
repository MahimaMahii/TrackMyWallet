 # ============================================================
#  TrackMyWallet - Application Configuration
#  IMPORTANT: Never put real passwords in this file.
#  Set the environment variable DB_PASSWORD in Windows before
#  running the app (see README or db-setup.md for instructions).
# ============================================================

# --- Server & Port (Render assigns PORT environment variable) ---
server.port=${PORT:8080}

# --- Reverse Proxy / HTTPS Forwarding (Render terminates SSL and forwards headers) ---
server.forward-headers-strategy=framework

# --- DataSource (MySQL) ---
# Supports DB_URL, DB_USER, DB_PASSWORD environment variables for remote databases (e.g., Aiven, TiDB, AWS RDS)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/trackmywallet?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true&characterEncoding=UTF-8}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
# update = automatically creates/updates tables without dropping existing data
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false

# --- Connection Pool (HikariCP) ---
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:2}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# --- HTTP Session & Cookies (Render HTTPS proxy compatible) ---
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# --- Static resources ---
spring.web.resources.static-locations=classpath:/static/
